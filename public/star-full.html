<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Star Bimbel - Login Multi Role</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>
</head>
<body class="bg-[#F8FAFC]">
<div id="app"></div>
<script>
const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
const studentsSeed=[{id:'SW1000',nama:'Andi Pratama',kelas:'X IPA 1',program:'SMA',wa:'08120001',status:'Aktif',wali:'Bapak Andi'},{id:'SW1001',nama:'Siti Aisyah',kelas:'XII UTBK A',program:'UTBK',wa:'08120002',status:'Aktif',wali:'Ibu Siti'},{id:'SW1002',nama:'Budi Santoso',kelas:'IX SMP 1',program:'SMP',wa:'08120003',status:'Aktif',wali:'Bapak Budi'}];
const teachersSeed=[{id:'GR01',nama:'Budi Hartono',mapel:'Matematika',tarif:75000,type:'pertemuan',status:'Aktif',email:'guru@starbimbel.id'},{id:'GR02',nama:'Siti Nurhaliza',mapel:'English',tarif:80000,type:'pertemuan',status:'Aktif',email:'siti@starbimbel.id'}];
let state={logged:false,role:'admin',menu:'dashboard',students:JSON.parse(JSON.stringify(studentsSeed)),teachers:teachersSeed,invoices:[{id:'INV001',siswa:'Andi Pratama',kelas:'X IPA 1',periode:'Agustus 2026',nominal:500000,jatuhTempo:'10 Agu 2026',status:'Belum Dibayar'},{id:'INV002',siswa:'Siti Aisyah',kelas:'XII UTBK A',periode:'Agustus 2026',nominal:500000,jatuhTempo:'10 Agu 2026',status:'Lunas'},{id:'INV003',siswa:'Budi Santoso',kelas:'IX SMP 1',periode:'Agustus 2026',nominal:450000,jatuhTempo:'10 Agu 2026',status:'Menunggu Verifikasi'}],payments:[{id:'PAY001',siswa:'Budi Santoso',nominal:450000,tgl:'05 Agu 2026',bank:'BCA',status:'Menunggu Verifikasi'}],filter:'Semua',search:'',currentWaliChild:'Andi Pratama',loginTab:'admin'};

const accounts = {
  admin: {email:'owner@starbimbel.id', pass:'admin123', name:'Owner Star Bimbel', role:'Owner'},
  guru: {email:'guru@starbimbel.id', pass:'guru123', name:'Budi Hartono', role:'Guru Matematika'},
  wali: {email:'wali@starbimbel.id', pass:'wali123', name:'Bapak Andi (Wali Andi)', role:'Wali Siswa'}
};

function badge(s){const m={'Belum Dibayar':'bg-red-100 text-red-700','Menunggu Verifikasi':'bg-amber-100 text-amber-700','Lunas':'bg-emerald-100 text-emerald-700','Terlambat':'bg-rose-100 text-rose-700','Aktif':'bg-emerald-100 text-emerald-700','Hadir':'bg-emerald-100 text-emerald-700'};return `<span class="px-2 py-1 rounded-full text-[11px] font-bold ${m[s]||'bg-slate-100'}">${s}</span>`}

function doLogin(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value;
  // cari akun yang cocok
  let foundRole=null;
  for(const k in accounts){
    if(accounts[k].email===email && accounts[k].pass===pass) foundRole=k;
  }
  if(!foundRole){
    alert('Email / Password salah!\\n\\nGunakan akun demo:\\nAdmin: owner@starbimbel.id / admin123\\nGuru: guru@starbimbel.id / guru123\\nWali: wali@starbimbel.id / wali123');
    return;
  }
  state.role=foundRole;
  state.logged=true;
  state.menu='dashboard';
  render();
}

function renderLogin(){
  const tabs = [
    {id:'admin', label:'Admin / Owner', icon:'👑'},
    {id:'guru', label:'Guru', icon:'👨‍🏫'},
    {id:'wali', label:'Siswa / Wali', icon:'👨‍👩‍👧'}
  ];
  return `<div class="min-h-screen flex">
  <div class="hidden lg:flex w-[50%] bg-gradient-to-br from-indigo-600 via-violet-600 to-indigo-800 p-10 flex-col justify-between text-white">
    <div><div class="flex items-center gap-3"><div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-indigo-600 font-bold">★</div><span class="font-bold">STAR BIMBEL</span></div></div>
    <div><h1 class="text-4xl font-bold leading-tight">Satu Aplikasi untuk<br><span class="text-amber-300">Semua Role Bimbel.</span></h1><p class="text-indigo-100 mt-4 text-sm max-w-md">Admin kelola operasional, Guru absensi & honor, Wali pantau SPP & kehadiran anak real-time.</p>
    <div class="mt-6 grid grid-cols-3 gap-3 text-xs"><div class="bg-white/10 rounded-xl p-3"><div class="font-bold text-lg">Admin</div><div class="opacity-80">Kelola siswa, tagihan, laporan laba rugi</div></div><div class="bg-white/10 rounded-xl p-3"><div class="font-bold text-lg">Guru</div><div class="opacity-80">Check-in, absensi siswa, lihat honor</div></div><div class="bg-white/10 rounded-xl p-3"><div class="font-bold text-lg">Wali</div><div class="opacity-80">Bayar SPP, lihat jadwal & kehadiran</div></div></div></div>
    <div class="text-xs opacity-60">© 2026 Star Bimbel • Asia/Jakarta</div>
  </div>
  <div class="flex-1 bg-white flex items-center justify-center p-6">
    <div class="w-full max-w-[420px]">
      <div class="lg:hidden flex items-center gap-2 mb-6"><div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">★</div><span class="font-bold">STAR BIMBEL</span></div>
      <h2 class="text-2xl font-bold">Masuk ke Star Bimbel</h2><p class="text-sm text-slate-500 mb-5">Pilih role kamu untuk login</p>
      <div class="bg-slate-100 p-1 rounded-xl flex gap-1 mb-5">
        ${tabs.map(t=>`<button onclick="state.loginTab='${t.id}';document.getElementById('email').value=accounts['${t.id}'].email;document.getElementById('pass').value=accounts['${t.id}'].pass;render()" class="flex-1 py-2.5 rounded-lg text-xs font-semibold ${state.loginTab===t.id?'bg-white shadow':''}">${t.icon} ${t.label}</button>`).join('')}
      </div>
      <div class="space-y-3">
        <input id="email" class="w-full border rounded-xl px-4 py-3 text-sm" value="${accounts[state.loginTab].email}" placeholder="Email">
        <input id="pass" type="password" class="w-full border rounded-xl px-4 py-3 text-sm" value="${accounts[state.loginTab].pass}" placeholder="Password">
        <button onclick="doLogin()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold">Masuk sebagai ${tabs.find(x=>x.id===state.loginTab).label} →</button>
      </div>
      <div class="mt-6 bg-slate-50 border rounded-xl p-3 text-xs space-y-1">
        <div class="font-bold">🔑 Akun Demo (klik tab di atas untuk auto-fill):</div>
        <div>👑 <b>Admin:</b> owner@starbimbel.id / admin123</div>
        <div>👨‍🏫 <b>Guru:</b> guru@starbimbel.id / guru123</div>
        <div>👨‍👩‍👧 <b>Wali:</b> wali@starbimbel.id / wali123</div>
      </div>
    </div>
  </div>
  </div>`;
}

function renderLayout(inner){
  const menuAdmin=[['dashboard','📊 Dashboard'],['siswa','👨‍🎓 Data Siswa'],['guru','👨‍🏫 Data Guru'],['tagihan','🧾 Tagihan SPP'],['pembayaran','💳 Pembayaran'],['payroll','💰 Gaji Guru'],['laporan','📑 Laba Rugi']];
  const menuGuru=[['dashboard','📊 Dashboard'],['jadwal','📅 Jadwal Mengajar'],['absensi-guru','⏰ Absensi Saya'],['absensi-siswa','✅ Absensi Siswa'],['payroll','💰 Honor Saya']];
  const menuWali=[['dashboard','📊 Dashboard'],['jadwal','📅 Jadwal Anak'],['tagihan','🧾 Tagihan SPP'],['kehadiran','✅ Kehadiran'],['pembayaran','💳 Riwayat Bayar']];
  const menus = state.role==='admin'?menuAdmin: state.role==='guru'?menuGuru:menuWali;
  const user = accounts[state.role];
  return `<div class="flex min-h-screen"><aside class="w-[250px] bg-white border-r hidden lg:flex flex-col"><div class="p-5 border-b flex items-center gap-3"><div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">★</div><div><div class="font-bold text-sm">STAR BIMBEL</div><div class="text-[10px] text-slate-500">${user.role}</div></div></div><div class="flex-1 p-3 space-y-1">${menus.map(m=>`<button onclick="state.menu='${m[0]}';render()" class="w-full text-left px-3 py-2.5 rounded-xl text-sm ${state.menu===m[0]?'bg-indigo-600 text-white':'hover:bg-slate-50'}">${m[1]}</button>`).join('')}</div><div class="p-3 border-t"><div class="bg-slate-50 p-2 rounded-xl flex items-center gap-2"><div class="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center">👤</div><div class="flex-1"><div class="text-xs font-bold">${user.name}</div><div class="text-[10px] text-slate-500">${user.email}</div></div></div><button onclick="state.logged=false;render()" class="mt-2 text-xs text-red-600">Keluar</button></div></aside><div class="flex-1"><header class="bg-white border-b p-4 flex gap-4 items-center sticky top-0 z-10"><div class="lg:hidden font-bold">★ STAR</div><input oninput="state.search=this.value;render()" placeholder="Cari..." class="bg-slate-100 rounded-xl px-4 py-2 text-sm w-full max-w-sm"><div class="ml-auto text-xs font-bold hidden lg:block">${user.name}</div></header><main class="p-4 lg:p-8 pb-20 lg:pb-8">${inner}</main><div class="lg:hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-30">${menus.slice(0,5).map(m=>`<button onclick="state.menu='${m[0]}';render()" class="flex flex-col items-center text-[10px] ${state.menu===m[0]?'text-indigo-600':''}"><span class="text-base">${m[1].split(' ')[0]}</span>${m[1].split(' ').slice(1).join(' ')}</button>`).join('')}</div></div></div>`;
}

function renderDashboard(){
  if(state.role==='admin'){
    return `<div class="space-y-6"><h1 class="text-xl font-bold">Dashboard Owner</h1><div class="grid grid-cols-2 lg:grid-cols-4 gap-4"><div class="bg-white p-5 rounded-2xl border"><div class="text-xs text-slate-500">Total Siswa</div><div class="text-2xl font-bold mt-1">${state.students.length}</div></div><div class="bg-white p-5 rounded-2xl border"><div class="text-xs text-slate-500">Guru Aktif</div><div class="text-2xl font-bold mt-1">${state.teachers.length}</div></div><div class="bg-white p-5 rounded-2xl border"><div class="text-xs text-slate-500">SPP Belum Lunas</div><div class="text-2xl font-bold mt-1 text-red-600">${state.invoices.filter(i=>i.status!=='Lunas').length}</div></div><div class="bg-indigo-600 text-white p-5 rounded-2xl"><div class="text-xs opacity-80">Laba Bersih</div><div class="text-2xl font-bold mt-1">Rp 12,4 jt</div></div></div><div class="bg-white rounded-2xl border overflow-auto"><div class="p-4 font-bold border-b">Tagihan Terbaru</div><table class="w-full text-sm"><thead class="bg-slate-50 text-xs"><tr><th class="p-3 text-left">Siswa</th><th class="p-3">Nominal</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr></thead><tbody>${state.invoices.map(i=>`<tr class="border-t"><td class="p-3">${i.siswa}</td><td class="p-3 font-bold">${rupiah(i.nominal)}</td><td class="p-3">${badge(i.status)}</td><td class="p-3"><button onclick="verif('${i.id}')" class="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded">Verifikasi</button></td></tr>`).join('')}</tbody></table></div></div>`;
  }
  if(state.role==='guru'){
    return `<div class="space-y-6"><h1 class="text-xl font-bold">Dashboard Guru</h1><div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 bg-gradient-to-br from-indigo-600 to-violet-600 text-white rounded-2xl p-6"><div class="text-sm opacity-80">Jadwal Hari Ini - ${teachersSeed[0].nama}</div><div class="text-2xl font-bold mt-1">3 Kelas • 6 Jam Mengajar</div><div class="mt-4 bg-white/20 rounded-xl p-3 text-xs">08:00 X IPA 1 (Matematika) • 13:00 XII UTBK A (Fisika) • 16:00 Private</div></div><div class="bg-white rounded-2xl border p-5"><div class="text-xs text-slate-500">Estimasi Honor Bulan Ini</div><div class="text-2xl font-bold mt-2">Rp 1.800.000</div><div class="text-xs mt-1">24 pertemuan x Rp75.000</div><button class="mt-3 w-full bg-indigo-50 text-indigo-600 py-2 rounded-xl text-xs font-bold">Lihat Slip Gaji</button></div></div><div class="bg-white rounded-2xl border p-6 text-center"><div class="text-5xl mb-3">⏰</div><h3 class="font-bold">Absensi Mengajar</h3><p class="text-xs text-slate-500 mb-4">Validasi GPS aktif • Harus di lokasi bimbel</p><div class="flex gap-3"><button onclick="alert('Check-In berhasil! GPS valid ✓')" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold">📍 Check In</button><button class="flex-1 bg-slate-100 text-slate-400 py-3 rounded-xl font-bold" disabled>Check Out</button></div></div></div>`;
  }
  if(state.role==='wali'){
    const child = state.students[0];
    const tagihan = state.invoices.find(i=>i.siswa===child.nama) || state.invoices[0];
    return `<div class="space-y-6"><h1 class="text-xl font-bold">Dashboard Wali - ${child.nama}</h1><div class="bg-gradient-to-br from-indigo-600 to-indigo-800 text-white rounded-2xl p-6 flex flex-wrap justify-between items-center gap-4"><div><div class="text-sm opacity-80">Tagihan Bulan Ini - ${child.nama}</div><div class="text-3xl font-bold mt-1">${rupiah(tagihan.nominal)}</div><div class="text-xs mt-2 opacity-80">Jatuh tempo ${tagihan.jatuhTempo} • ${tagihan.status}</div></div><button onclick="state.menu='pembayaran';render()" class="bg-amber-400 text-slate-900 px-6 py-3 rounded-xl font-bold">Bayar SPP →</button></div><div class="grid lg:grid-cols-3 gap-4"><div class="bg-white rounded-2xl border p-5"><h4 class="font-bold text-sm mb-2">Kehadiran ${child.nama}</h4><div class="text-3xl font-bold">92%</div><div class="w-full bg-slate-100 h-2 rounded-full mt-2"><div class="bg-emerald-500 h-2 rounded-full" style="width:92%"></div></div><div class="text-xs text-slate-500 mt-2">22 hadir • 1 izin • 1 alpha</div></div><div class="bg-white rounded-2xl border p-5"><h4 class="font-bold text-sm mb-2">Jadwal Terdekat</h4><div class="text-sm space-y-2"><div class="flex justify-between"><span>Senin 08:00</span><span class="font-bold">Matematika</span></div><div class="flex justify-between"><span>Rabu 13:00</span><span class="font-bold">UTBK</span></div></div></div><div class="bg-white rounded-2xl border p-5"><h4 class="font-bold text-sm mb-2">Pengumuman</h4><div class="text-xs bg-amber-50 border border-amber-200 rounded-xl p-3">Libur 17 Agustus, bimbel tutup. Kelas pengganti Jumat 22 Agustus jam 08:00.</div></div></div></div>`;
  }
}

function getContent(){
  const m=state.menu;
  if(m==='dashboard') return renderDashboard();
  if(m==='siswa' || m==='kehadiran') return `<div class="space-y-4"><h1 class="text-xl font-bold">Data Siswa</h1><div class="bg-white rounded-2xl border overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-xs"><tr><th class="p-3 text-left">Nama</th><th class="p-3">Kelas</th><th class="p-3">Status</th></tr></thead><tbody>${state.students.map(s=>`<tr class="border-t"><td class="p-3 font-medium">${s.nama}</td><td class="p-3">${s.kelas}</td><td class="p-3">${badge(s.status)}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(m==='guru') return `<div class="space-y-4"><h1 class="text-xl font-bold">Data Guru</h1><div class="grid lg:grid-cols-3 gap-4">${state.teachers.map(g=>`<div class="bg-white p-5 rounded-2xl border"><div class="font-bold">${g.nama}</div><div class="text-xs text-slate-500">${g.mapel}</div><div class="mt-2 font-bold">${rupiah(g.tarif)}</div></div>`).join('')}</div></div>`;
  if(m==='tagihan') return `<div class="space-y-4"><h1 class="text-xl font-bold">Tagihan SPP ${state.role==='wali'?'- '+state.students[0].nama:''}</h1><div class="bg-white rounded-2xl border overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-xs"><tr><th class="p-3 text-left">Siswa</th><th class="p-3">Periode</th><th class="p-3">Nominal</th><th class="p-3">Status</th>${state.role!=='wali'?'<th class="p-3">Aksi</th>':''}</tr></thead><tbody>${state.invoices.filter(inv=>state.role==='wali'?inv.siswa===state.students[0].nama:true).map(i=>`<tr class="border-t"><td class="p-3">${i.siswa}</td><td class="p-3">${i.periode}</td><td class="p-3 font-bold">${rupiah(i.nominal)}</td><td class="p-3">${badge(i.status)}</td>${state.role!=='wali'?`<td class="p-3"><button onclick="verif('${i.id}')" class="bg-indigo-50 text-indigo-600 px-2 py-1 rounded text-xs">Verifikasi</button></td>`:''}</tr>`).join('')}</tbody></table></div>${state.role==='wali'?`<button onclick="alert('Upload bukti transfer BCA 12345678 a.n Star Bimbel')" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold mt-4">📤 Upload Bukti Bayar</button>`:''}</div>`;
  if(m==='pembayaran') return `<div class="space-y-4"><h1 class="text-xl font-bold">${state.role==='wali'?'Riwayat Pembayaran Anak':'Pembayaran Masuk'}</h1><div class="bg-white rounded-2xl border overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-xs"><tr><th class="p-3 text-left">Siswa</th><th class="p-3">Nominal</th><th class="p-3">Status</th><th class="p-3">Aksi</th></tr></thead><tbody>${state.payments.map(p=>`<tr class="border-t"><td class="p-3">${p.siswa}</td><td class="p-3 font-bold">${rupiah(p.nominal)}</td><td class="p-3">${badge(p.status)}</td><td class="p-3"><button onclick="approve('${p.id}')" class="bg-emerald-50 text-emerald-700 px-2 py-1 rounded text-xs">${state.role==='wali'?'Lihat Bukti':'Setujui'}</button></td></tr>`).join('')}</tbody></table></div></div>`;
  if(m==='payroll') return `<div class="space-y-4"><h1 class="text-xl font-bold">${state.role==='guru'?'Honor Saya':'Gaji Guru'}</h1><div class="bg-white rounded-2xl border overflow-auto"><table class="w-full text-sm"><thead class="bg-slate-50 text-xs"><tr><th class="p-3 text-left">Guru</th><th class="p-3">Pertemuan</th><th class="p-3">Total</th></tr></thead><tbody>${state.teachers.map(t=>`<tr class="border-t"><td class="p-3">${t.nama}</td><td class="p-3 text-center">24</td><td class="p-3 font-bold">${rupiah(24*t.tarif)}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(m==='laporan' || m==='jadwal' || m==='absensi-guru' || m==='absensi-siswa') return `<div class="bg-white rounded-2xl border p-10 text-center"><div class="text-4xl mb-3">🚧</div><div class="font-bold">Fitur ${m}</div><div class="text-xs text-slate-500">Tersedia di versi Next.js + Supabase (butuh database). Untuk demo HTML, fokus ke Dashboard & Tagihan dulu.</div></div>`;
  return renderDashboard();
}

function render(){document.getElementById('app').innerHTML=state.logged?renderLayout(getContent()):renderLogin();}
function verif(id){const inv=state.invoices.find(i=>i.id===id); if(inv){inv.status='Lunas';alert('LUNAS! Masuk pemasukan & laporan laba rugi');render()}}
function approve(id){const p=state.payments.find(x=>x.id===id); if(p){p.status='Disetujui';const inv=state.invoices.find(i=>i.siswa===p.siswa); if(inv) inv.status='Lunas';alert('Pembayaran disetujui!');render()}}
render();
</script>
</body>
</html>
